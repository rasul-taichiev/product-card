<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Product</title>
        <link rel="stylesheet" href="style.css" />
        <script src="main.js" defer></script>
        <script src="homework-7.js" defer></script>
        <script src="homework-8.js" defer></script>
        <script type="module" src="homework-9.js"></script>
        <script type="module" src="comments.js"></script>
        <script type="module" src="homework-10.js"></script>
        <script type="module" src="productCards.js"></script>
    </head>

    <body>
        <main class="main"></main>
        <div class="container catalog__container"></div>
        <ul class="products clear-list"></ul>
        <template id= "card-template">
            <li class="product__item card">
                <img src="" alt="" class="card__image"/>
                <span class="card__category"></span>
                <h2 class="card__name"></h2>
                <p class="card__description"></p> 
                <div class="card__compound compound">
                    <span class="compound__name">Состав:</span>
                    <ul class="compound__list">
                        <li class="li-1"></li>
                        <li class="li-2"></li>
                        <li class="li-3"></li>
                    </ul>
                    <div class="card__price">
                         <b>Цена</b>
                        <span class="card__price-value"></span>
                    </div>
                </div>       
            </li>
        </template>
    </body>
</html>
