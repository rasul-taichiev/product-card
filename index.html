<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Product</title>
        <link rel="stylesheet" href="style.css" />
        <script type="module" src="main.js"></script>
    </head>
    <body>
        <main class="main">
            <div class="container catalog__container">
                <h1 class="title catalog__title">Выбери свой продукт</h1>
                <div class="catalog__buttons">
                    <button id="change-color-all-card">
                        Сменить цвет всех карточек
                    </button>
                    <button id="changeFirstCard">
                        Сменить цвет первой карточки
                    </button>
                    <button id="goto-google">Перейти в Гугл</button>
                    <button id="output-console-log">
                        Вывести предупреждение и сообщение в консоль
                    </button>
                    <button id="buttonChanger">Кнопка с сюрпризом</button>
                </div>
                <ul class="products clear-list"></ul>
                <template id="card-template">
                    <li class="product__item card">
                        <img src="" alt="" class="card__image" />
                        <span class="card__category"></span>
                        <h2 class="card__name"></h2>
                        <p class="card__description"></p>
                        <div class="card__compound compound">
                            <span class="compound__name">Состав:</span>
                            <ul class="compound__list">
                                <li class="li-1"></li>
                                <li class="li-2"></li>
                                <li class="li-3"></li>
                            </ul>
                        </div>
                        <div class="card__price">
                            <b>Цена</b>
                            <span class="card__price-value"></span>
                        </div>
                    </li>
                </template>
            </div>
        </main>
        <footer class="footer__container">
            <div class="footer__columns">
                <div class="footer__column-first">
                    <div class="footer__product-introduction">
                        <h2>Product Cards</h2>
                        <p>У Нас Самые Лучшие Продукты Для Кожи!</p>
                    </div>
                    <div class="product__icon">
                        <img src="/images/telegramIcon.png" alt="Telegram" />
                        <img src="/images/vkontakteIcon.png" alt="VK" />
                    </div>
                </div>
                <div class="footer__column-second">
                    <p class="footer__text">Подпишись на наши акции:</p>
                    <form class="footer__form" id="footer__submit-form">
                        <input
                            type="email"
                            name="email"
                            class="footer__input"
                            placeholder="Введи Email..."
                            required
                        />
                        <button type="submit" class="footer__submit">
                            Подписаться
                        </button>
                    </form>
                </div>
                <div class="footer__column-third">
                    <p class="footer__link-help">Быстрые ссылки</p>
                    <nav>
                        <ul class="footer__menu">
                            <li><a href="#">Главная</a></li>
                            <li><a href="#">О нас</a></li>
                            <li><a href="#">Контакты</a></li>
                        </ul>
                    </nav>
                </div>
            </div>
            <div class="footer__column-last">
                <button
                    type="button"
                    class="footer__registration"
                    id="footer__button-open">
                    Регистрация
                </button>
                <div class="overlay" id="modalWindow">
                    <div class="modal">
                        <form
                            class="registration__form"
                            id="registration__submit-form"
                        >
                            <label>
                                <input
                                    type="text"
                                    name="name"
                                    class="registration__name"
                                    pattern="^[a-zA-Zа-яА-ЯЁё]+$"
                                    placeholder="пример: Медер"
                                    data-error-message="Разрешены символы латиницы,
                                    кириллицы."
                                    aria-describedby="name-error"
                                    required
                                />
                            </label>
                            <label>
                                <input
                                    type="text"
                                    name="surname"
                                    class="registration__surname"
                                    pattern="^[a-zA-Zа-яА-ЯЁё]+$"
                                    placeholder="пример: Исаков"
                                    data-error-message="Разрешены символы латиницы,
                                    кириллицы."
                                    aria-describedby="surname-error"
                                    required
                                />
                            </label>
                            <label class="footer__label-dateOfBirth">
                                Введите дату рождения
                                <input
                                    type="date"
                                    id="dateOfBirth"
                                    name="dateOfBirth"
                                    class="registration__dateOfBirth"
                                    min="1900-01-01"
                                    max="2026-12-31"
                                    required
                                />
                            </label>
                            <label>
                                <input
                                    type="text"
                                    name="login"
                                    class="registration__login"
                                    pattern="^[a-zA-Z0-9_\-]+$"
                                    placeholder="пример: Isakov"
                                    data-error-message="Разрешены символы латиницы,
                                    цифры,тире и нижнее подчеркивание"
                                    minlength="1"
                                    maxlength="10"
                                    aria-describedby="login-error"
                                    required
                                />
                            </label>
                            <input
                                type="password"
                                name="password"
                                class="registration__password"
                                placeholder="Введите ваш пароль"
                                pattern="^\S{8,20}$"
                                data-error-message="Минимум 8 символов,пробелы запрещены!"
                                required
                            />
                            <input
                                type="password"
                                name="passwordConfirm"
                                class="registration__password-confirm"
                                placeholder="Подтвердите ваш пароль"
                                required
                            />
                            <button type="submit">Зарегистрироваться</button>
                        </form>
                        <button
                            type="button"
                            class="registration__button-close"
                            id="footer__button-close"
                        >
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                </div>
                <img src="/images/lineIcon.png" alt="line_Icon" />
                <p>www.product-cards.com©all right reserve</p>
            </div>
        </footer>
    </body>
</html>
